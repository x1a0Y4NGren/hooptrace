name: hooptrace
description: Offline-first basketball one-on-one scoring and replay.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  crypto: ^3.0.7
  cupertino_icons: ^1.0.8
  csv: ^8.0.0
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  file_picker: ^12.0.0
  flutter_riverpod: ^3.3.2
  go_router: ^17.5.0
  intl: ^0.20.2
  path: ^1.9.0
  path_provider: ^2.1.6
  share_plus: ^13.3.0
  url_launcher: ^6.3.1
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.15.1
  drift_dev: ^2.34.0
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/icons/
    - assets/images/
